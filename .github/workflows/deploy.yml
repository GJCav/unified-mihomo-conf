name: Test and deploy Worker

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          upload_log=$(mktemp)
          WRANGLER_OUTPUT_FILE_PATH="$upload_log" npx wrangler versions upload
          version_id=$(jq -er 'select(.type == "version-upload") | .version_id | strings | select(length > 0)' "$upload_log")
          npx wrangler versions deploy "${version_id}@100%" --yes
